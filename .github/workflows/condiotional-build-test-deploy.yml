name: Bygg, testa och villkorlig deploy

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt upp Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gör Maven Wrapper körbar
        run: chmod +x ./mvnw

      - name: Bygg projeket
        run: ./mvnw -B clean compile

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Sätt up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Gör Maven Körbar
        run: chmod +x ./mvnw

      - name: Kör tester
        run: ./mvnw -B test

      - name: Ladda upp Surefire-rapporter
        if: always()
        uses: actions/upload-artifact@v4
        with:
         name: surefire-reports
         path: target/surefire-reports/
         if-no-files-found: warn

  deploy:
   runs-on: ubuntu-latest
   needs: test
   if: success() && github.ref == 'refs/heads/main'
   steps:
     - name: Deploy till produktion (simulerad)
       run: echo "deployar user-registration-api till produktion"



