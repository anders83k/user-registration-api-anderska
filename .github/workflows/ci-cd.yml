name: CI/CD - user-registration-api

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read  #denna rad är bra praxis, tillåter läsning utan att skriva tillbaka.

jobs:
  build:
    name: Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Hämta koden
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cach: maven

      - name: Gör Maven Wrapper körbar
        run: chmod +x ./mvnw

      - name: Build application without running tests again
        run: ./mvnw -B -DskipTests clean package #tar bort tidigare byggresultat från target (för deploy)
#testet körs i senare skede, B är att den ej väntar på mänskig interaktion utan är helautomatisk.
      - name: Ladda upp  byggresultat
        uses: actions/upload-artifact@v4
        with:
          name: user-registration-api-jar
          path: target/user-registration-api-*.jar #fil eller mapp som skapas från en runner. *betyder att allt innan * måste ingå i filnamnet.
          if-no-files-found: error

  test:
    name: Run automatic tests # ett namn som ej är del av en lista med steps saknar bindestreck.
    runs-on: ubuntu-latest
    needs: build #needs build gör att testet behöver egen checkout, setup med mera, se koden nedan.

    steps: # steps är plural, alltid lista med bindestreck före name.
     - name: fetch code
       uses: actions/checkout@v4

     - name: Setup Java
       uses: actions/setup-java@v5
       with:
         java-version: '21'
         distribution: temurin
         cache: maven

     - name: Gör Maven körbar
       run: chmod +x ./mvnw

     - name: Run tests
       run: ./mvnw -B test

     - name: Upload Surefire reports
       if: always()
       uses: actions/upload-artifact@v4
       with:
         name: test-results
         path: target/surefire-reports/
         if-no-files-found: warn